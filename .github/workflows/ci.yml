name: CI

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7

      - run: make setup
      - run: make lint
      - run: make test

      - uses: hexlet-components/hello-from-hexlet-action@release