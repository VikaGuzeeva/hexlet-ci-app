name: CI

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'

      - run: npm install -g pnpm

      - run: make setup
      - run: make lint
      - run: make test